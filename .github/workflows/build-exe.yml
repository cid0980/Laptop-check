name: Build Windows exe

# Repeatable release pipeline.
#   * every push to main  -> build + self-test + keep the exe as an artifact
#   * tag v*.*.*          -> same, plus a draft GitHub Release with the exe attached
#
# The app is pure Python standard library, so the only dependency of the
# build itself is PyInstaller. Nothing else is installed, ever.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: PyInstaller onefile (Windows, Python 3.11)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Show versions
        run: |
          python --version
          python -m PyInstaller --version

      - name: Headless self-test (demo scan -> grade -> price -> report)
        run: python run.py --selftest

      - name: Build the single-file exe
        run: python -m PyInstaller LaptopCheckPro.spec --noconfirm --clean

      - name: Code-sign the exe (only when a certificate secret is configured)
        # Unsigned exes trigger SmartScreen "unknown publisher". Add repository
        # secrets SIGN_PFX_BASE64 (base64 of a code-signing .pfx) and SIGN_PFX_PASS
        # and every release is signed automatically - see docs/signing.md.
        # (secrets cannot be read in a step-level if:, so the step always runs
        #  and skips itself when the env var is empty.)
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASS: ${{ secrets.SIGN_PFX_PASS }}
        run: |
          if (-not $env:SIGN_PFX_BASE64) {
            Write-Host "No signing certificate configured - shipping unsigned (SmartScreen will warn once per PC)."
            exit 0
          }
          [IO.File]::WriteAllBytes("sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          choco install -y osslsigncode --no-progress | Out-Null
          osslsigncode sign -pkcs12 sign.pfx -pass "$env:SIGN_PFX_PASS" `
            -n "Laptop Check Pro" -i "https://github.com/cid0980/Laptop-check" `
            -t http://timestamp.sectigo.com `
            -in dist\LaptopCheckPro.exe -out dist\LaptopCheckPro-signed.exe
          Move-Item -Force dist\LaptopCheckPro-signed.exe dist\LaptopCheckPro.exe
          Remove-Item sign.pfx

      - name: Sanity-check the built exe (headless, no GUI)
        shell: pwsh
        run: |
          $exe = "dist\LaptopCheckPro.exe"
          if (-not (Test-Path $exe)) { throw "dist\LaptopCheckPro.exe missing" }
          $size = (Get-Item $exe).Length
          Write-Host "exe size: $size bytes"
          if ($size -lt 5MB) { throw "exe looks too small ($size bytes)" }
          # the frozen exe must still answer headless switches
          & $exe --selftest | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "frozen exe self-test failed" }
          Write-Host "frozen exe self-test OK"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaptopCheckPro-windows-x64
          path: dist/LaptopCheckPro.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LaptopCheckPro.exe
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
